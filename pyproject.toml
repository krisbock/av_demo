[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "av-databricks-fabric-ai-demo"
version = "0.1.0"
description = "Synthetic Ambulance Victoria Databricks and Fabric AI demonstration"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
]
databricks = [
  "databricks-sdk>=0.38,<1",
  "pyspark>=3.5,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/av_demo"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["av_demo"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
